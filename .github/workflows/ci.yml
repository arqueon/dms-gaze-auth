name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y git jq python3-jsonschema qt6-declarative-dev-tools ripgrep shellcheck
      - name: Fetch the DMS validation source
        run: git clone --depth 1 https://github.com/AvengeMedia/DankMaterialShell.git /tmp/dms-source
      - name: Run repository tests
        env:
          DMS_SOURCE: /tmp/dms-source
        run: ./tests/test.sh
